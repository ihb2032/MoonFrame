# The scheduled updates bot: probe the two pinned version surfaces this
# repository carries and, for each pin the world has moved past, open a
# focused PR from the github-actions identity.
#
# Why bespoke: mooncakes is not an ecosystem Dependabot or Renovate knows,
# and the toolchain pin is a build string only the compiler can spell back
# (the CDN resolves the `latest` alias server-side and 403s listings). The
# probe script therefore asks the two official sources directly — the
# installed compiler for the toolchain, the refreshed registry index for the
# dependencies — and turns each drift into a PR that follows the repository's
# conventions (one conventional commit, a one-paragraph body).
#
# Everything the job needs write access to is named here and nowhere else:
# contents + pull-requests, for pushing branches and opening PRs, and
# workflows — the toolchain pin lives in the ci and docs workflow files,
# so a bump commit carries a workflow edit and GitHub refuses that push
# without the permission (the first drift after the bot landed caught
# exactly this). It never touches releases, issues, or secrets.
#
# No CI runs on the PRs this opens, and none can: they are created with this
# workflow's own `github.token`, and GitHub fires no `pull_request` — or
# `push` — event for anything the default token creates (a bot must not be
# able to review its own work). A PAT or App installation token would lift
# that, and the repository deliberately carries neither, so each PR body
# says so and carries the local verification recipe a human runs before
# merging instead. Widening ci.yml's `on:` to the bot branches cannot work
# for the same reason: the bot's pushes are as token-authored as its PRs.
#
# Cadence: Monday 03:00 UTC, and on demand via workflow_dispatch.

name: updates

on:
  schedule:
    - cron: "0 3 * * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  workflows: write

concurrency:
  group: updates
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # The probe installs a toolchain, refreshes an index, and pushes at most
    # a handful of one-commit branches — minutes of work. The cap is for a
    # hung install or a stalled network call, not for the happy path.
    timeout-minutes: 15
    steps:
      - name: Checkout
        # Pinned to a full commit SHA rather than the movable `v5` tag, so a
        # retagged or compromised release can't silently change what runs in
        # CI. Bump deliberately: resolve the new tag to its commit SHA and
        # update the trailing version comment to match.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install MoonBit (latest)
        # `latest` is the install script's default when no version is passed.
        # The probe asks the installed compiler for the resolved version
        # string, so this machine never needs to know it in advance.
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Probe pins and open update PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/open_update_prs.sh .
