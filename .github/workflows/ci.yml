name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_scale:
        description: Differential-fuzzer case multiplier (clamped to 1..20)
        required: false
        default: "20"

# Least privilege: this workflow only checks out the repo and runs the
# toolchain — it never writes back, cuts a release, or touches PRs/issues.
# Pinning the GITHUB_TOKEN to read-only means a compromised step or a tampered
# dependency cannot push commits or otherwise mutate repository state. A future
# job that needs more can widen its own `permissions:` block.
permissions:
  contents: read

# Pin the MoonBit toolchain so CI matches the version this project is built
# and gated against locally. The official install scripts
# (cli.moonbitlang.com) read MOONBIT_INSTALL_VERSION and URL-encode the `+`
# themselves. Left on "latest", a newer release regressed `moon test` across
# every OS even though the suite is green on this toolchain. To adopt a newer
# toolchain, bump this to a version published under
# https://cli.moonbitlang.com/binaries/<version>/ and re-run the full local
# gate (moon check --deny-warn && moon fmt --check && moon info && moon test)
# first.
env:
  MOONBIT_INSTALL_VERSION: "0.10.4+2cc641edf" # == moonc v0.10.4+2cc641edf (2026-07-15)

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other OSes when one fails — we want the full
      # cross-platform picture on every run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        # Pinned to a full commit SHA rather than the movable `v5` tag, so a
        # retagged or compromised release can't silently change what runs in
        # CI. Bump deliberately: resolve the new tag to its commit SHA and
        # update the trailing version comment to match.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Show versions
        run: moon version --all

      # `moon update` reaches the network for the module index, and every gate
      # in this job runs after it — so one transient failure here skips the
      # Array guard, the documentation guards, `moon fmt --check`, `moon info`,
      # the all-backend tests, the fuzzer, coverage and the benchmarks, leaving
      # a red build that says nothing about the commit. Retry a few times before
      # calling it: an index fetch that fails three times, spaced out, is an
      # outage rather than a flake. `shell: bash` so the same loop runs on the
      # Windows runner, whose default shell is PowerShell.
      - name: Update package index
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if moon update; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "moon update failed (attempt $attempt/3); retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          echo "moon update failed three times; treating it as an outage" >&2
          exit 1

      # ---------------------------------------------------------------------
      # Hard-requirement gate. The pre-acceptance rubric requires four
      # processes — `moon check --deny-warn`, `moon fmt`, `moon info`,
      # `moon test` — each run explicitly below so they are unmistakably
      # present and executed. (`--deny-warn` is a `moon check` flag; `moon
      # fmt` and `moon info` do not take it.)
      # ---------------------------------------------------------------------

      # (1/4) `moon check` — `--deny-warn` turns every enabled warning into an
      # error. The module's `warnings` field in moon.mod widens this to the
      # full strict set (`+a`) minus a few deliberate exceptions
      # (unnecessary_annotation, test_unqualified_package,
      # unqualified_local_using, and the proof-only missing_invariant /
      # missing_reasoning), so the rest are enforced here.
      - name: (1/4) moon check (deny warnings)
        run: moon check --deny-warn

      # (2/4) `moon fmt`. Run in check mode so CI fails on any unformatted
      # file without rewriting the working tree. Formatting is
      # platform-independent, so Linux is authoritative.
      - name: (2/4) moon fmt (formatting check)
        if: runner.os == 'Linux'
        run: moon fmt --check

      # (3/4) `moon info`: regenerate the interface (`pkg.generated.mbti`)
      # files and fail on any drift. Ahead of the guards below on purpose —
      # three of them read those files, so regenerating first means an
      # accidental export is diagnosed by the guard that can name it ("a method
      # added to a re-exported type", "an internal package in a public
      # interface") rather than by a generic interface diff.
      - name: (3/4) moon info (interface drift check)
        if: runner.os == 'Linux'
        run: |
          moon info
          # `git diff --exit-code` only inspects *tracked* files, so a newly
          # added package whose generated `pkg.generated.mbti` was never
          # committed would slip through green. `git add -N` (intent-to-add)
          # pulls untracked output into the diff first, so both tracked drift
          # and a new package's uncommitted mbti fail the gate. `.gitignore`
          # still excludes `_build` / `PLAN*.md`, so only real interface drift
          # trips it.
          git add -N .
          git diff --exit-code

      - name: Guard public Array copy boundaries
        if: runner.os == 'Linux'
        run: |
          python -B .github/scripts/check_array_copy_boundaries_test.py
          python -B .github/scripts/check_array_copy_boundaries.py

      # Documentation guards. Everything else in this workflow protects
      # executable content — sources, interfaces, tests, snapshots — which is
      # why prose is where this repository's drift collects instead. These
      # check the parts that *are* mechanically checkable against the code: the
      # release version, names that no longer exist, the public matchable-enum
      # surface, the whole callable surface the facade promises — every
      # method, field and impl a re-exported type carries with it, not just the
      # names the facade itself lists — the set of internal packages the
      # architecture docs describe, the layering rule those documents state,
      # read back off the build manifests, and the hidden cross-package engine
      # seams, which by construction reach no generated interface and so are
      # invisible to every guard above. Written in `sh` rather
      # than Python (as the
      # Array-boundary guard above is) so they run identically on a
      # contributor's machine without a Python install; the self-test runs
      # first, so a guard that has stopped catching anything fails here rather
      # than passing vacuously.
      - name: Guard documentation against the code
        if: runner.os == 'Linux'
        run: |
          sh .github/scripts/doc_guards_test.sh
          sh .github/scripts/check_version_identity.sh
          sh .github/scripts/check_stale_names.sh
          sh .github/scripts/check_enum_surface.sh
          sh .github/scripts/check_facade_surface.sh
          sh .github/scripts/check_internal_packages.sh
          sh .github/scripts/check_layering.sh
          sh .github/scripts/check_engine_seams.sh

      # A real downstream module: it lives outside this one and imports ONLY the
      # root facade (`@moonframe`), the way a user's project does. `moon check`
      # compiles a spread of typical pipelines, so the facade failing to
      # re-export a symbol a caller must name — or a fluent-chain intermediate
      # (`WhenThen` / `GroupedDataFrame` / …) becoming necessary to name —
      # surfaces as a red build here instead of biting the first user to try it.
      # It is a nested module (its own JSON manifest — `moon.mod.json` /
      # `moon.pkg.json`), so the root `moon check` / `fmt` / `info` above skip it
      # as a module boundary; it is exercised explicitly. The JSON manifest is
      # kept deliberately: the fixture path-depends on `../../..`, which the JSON
      # `deps` field supports directly — the newer `moon.mod` format needs a
      # `moon.work` workspace for a local path dep, unneeded machinery here.
      # Linux-only, matching the other guards.
      - name: Guard the facade against a downstream consumer
        if: runner.os == 'Linux'
        working-directory: .github/fixtures/facade_smoke
        run: moon check

      # Advisory, never a failure: absolute claims ("all", "every", "never")
      # in prose this branch adds, annotated on the diff so a reviewer
      # confirms each one still holds. The checkout is shallow, so the base
      # commit is fetched on its own before the diff.
      - name: Review absolute wording in added prose
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          sh .github/scripts/review_absolute_wording.sh "$PR_BASE_SHA"
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # (4/4) `moon test`. Every OS runs the default target so
      # platform-specific behaviour (notably the filesystem-backed read/write
      # paths) is exercised on Windows / macOS too.
      - name: (4/4) moon test (default target)
        run: moon test

      # The full multi-backend matrix runs on Linux to keep CI fast; drop the
      # `if:` guard to widen it to every OS.
      - name: Run tests (all backends)
        if: runner.os == 'Linux'
        run: moon test --target all

      # There is no release-only tier: the expanded optimizer differential
      # suite and the parity suites run on every push and pull request, so a
      # change cannot merge without passing what a release run would have
      # asked of it. They are cheap enough for that — the fuzzer is ~25s at
      # the full multiplier and the parity suites are ~1s — and the fuzzer's
      # seeds are fixed, so a bigger case count stays deterministic.
      #
      # The multiplier: the suite itself clamps to 1..=20 and falls back to 1
      # for a missing or invalid value. `inputs` is empty for push /
      # pull_request, so the fallback below supplies the full multiplier on
      # those events and a manual dispatch can dial it down.
      - name: Differential fuzz expansion
        if: runner.os == 'Linux'
        env:
          MOONFRAME_FUZZ_SCALE: ${{ inputs.fuzz_scale || '20' }}
        run: moon test lazy/optimize_fuzz_test.mbt

      # Both suites are part of the workspace-wide `moon test` above; running
      # them by name keeps them individually visible in the step list, so a
      # parity failure is legible without reading the full test log.
      - name: Backend and IO parity suites
        if: runner.os == 'Linux'
        run: |
          moon test series/backend_parity_test.mbt
          moon test io/roundtrip_corpus_test.mbt

      - name: Coverage (line coverage must be complete)
        if: runner.os == 'Linux'
        run: |
          moon coverage analyze | tee coverage-analyze.txt
          grep -q "All source files are fully covered" coverage-analyze.txt

      # Benchmarks are not a performance gate — timings are machine-dependent,
      # so there is no pass/fail threshold. But executing them here means a
      # change that breaks a benchmark at runtime — or a contributed benchmark
      # with a runtime bug — fails CI instead of silently rotting until someone
      # runs `moon bench` locally. `moon check` above only compiles them; this
      # runs them. Linux-only, matching the other heavy gates.
      - name: Run benchmarks (execution check, not a perf gate)
        if: runner.os == 'Linux'
        run: moon bench
